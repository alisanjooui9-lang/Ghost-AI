<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GHOST AI | چت</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#070707;
    color:#fff;
    font-family:tahoma,Arial,sans-serif;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* هدر */

.header{
    height:70px;
    background:#111;
    border-bottom:1px solid #333;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.header-buttons{
    display:flex;
    gap:7px;
}

.header-btn{
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:10px;
    padding:9px 11px;
    cursor:pointer;
}

/* بخش چت */

.chat{
    flex:1;
    overflow-y:auto;
    padding:15px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

/* پیام */

.message{
    max-width:85%;
    padding:12px 15px;
    border-radius:16px;
    line-height:1.8;
    white-space:pre-wrap;
    word-break:break-word;
}

.user{
    align-self:flex-start;
    background:#303030;
    border-bottom-left-radius:5px;
}

.ai{
    align-self:flex-end;
    background:#151515;
    border:1px solid #333;
    border-bottom-right-radius:5px;
}

/* صفحه خوش آمد */

.welcome{
    margin:auto;
    text-align:center;
    color:#999;
    padding:20px;
}

.welcome-icon{
    font-size:60px;
}

.welcome h2{
    color:white;
}

/* تایپ کردن */

.typing{
    align-self:flex-end;
    color:#777;
    font-size:13px;
    padding:5px;
}

/* پایین صفحه */

.input-area{
    background:#111;
    border-top:1px solid #333;
    padding:10px;

    display:flex;
    gap:8px;
}

.input-area input{
    flex:1;

    background:#222;
    color:white;

    border:1px solid #444;
    border-radius:13px;

    padding:14px;

    outline:none;
    font-family:tahoma;
    font-size:15px;
}

.send-btn{
    width:55px;

    background:#333;
    color:white;

    border:1px solid #555;
    border-radius:13px;

    font-size:20px;
    cursor:pointer;
}

/* وضعیت */

.status{
    position:fixed;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);

    background:#222;
    border:1px solid #444;

    padding:10px 16px;
    border-radius:12px;

    display:none;
    z-index:10;
}

</style>

</head>


<body>


<!-- هدر -->

<header class="header">

<div class="logo">
👻 GHOST AI
</div>

<div class="header-buttons">

<button class="header-btn" onclick="goMenu()">
☰
</button>

<button class="header-btn" onclick="clearChat()">
🗑️
</button>

</div>

</header>



<!-- چت -->

<main class="chat" id="chat">

<div class="welcome" id="welcome">

<div class="welcome-icon">
🤖
</div>

<h2 id="welcomeTitle">
سلام 👻
</h2>

<p>
من GHOST AI هستم.
<br>
بدون اینترنت می‌توانم به بعضی از سؤال‌ها پاسخ بدهم.
</p>

</div>

</main>



<!-- وضعیت -->

<div class="status" id="status"></div>



<!-- ورودی -->

<div class="input-area">

<input
id="messageInput"
type="text"
placeholder="پیامت را بنویس..."
autocomplete="off"
>

<button
class="send-btn"
onclick="sendMessage()"
>
➤
</button>

</div>



<script>

/* =========================
   تنظیمات اولیه
========================= */

const chat =
document.getElementById("chat");

const input =
document.getElementById("messageInput");

const welcome =
document.getElementById("welcome");

const welcomeTitle =
document.getElementById("welcomeTitle");

const statusBox =
document.getElementById("status");


/* نام کاربر */

const username =
localStorage.getItem("ghost_username");

if(username){

welcomeTitle.innerText =
"سلام " + username + " 👻";

}


/* =========================
   ذخیره گفتگو
========================= */

let savedMessages =
JSON.parse(
localStorage.getItem("ghost_chat") || "[]"
);


/* نمایش پیام‌های قبلی */

if(savedMessages.length > 0){

welcome.style.display="none";

savedMessages.forEach(function(item){

addMessage(
item.text,
item.type,
false
);

});

}


/* =========================
   ارسال با Enter
========================= */

input.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

sendMessage();

}

}
);


/* =========================
   ارسال پیام
========================= */

function sendMessage(){

const text =
input.value.trim();

if(text === ""){

return;

}


/* مخفی کردن خوش آمد */

welcome.style.display="none";


/* پیام کاربر */

addMessage(
text,
"user",
true
);


input.value="";


/* نمایش حالت فکر کردن */

const typing =
document.createElement("div");

typing.className="typing";

typing.innerText =
"👻 GHOST AI در حال فکر کردن...";

chat.appendChild(typing);

scrollChat();


/* پاسخ آفلاین */

setTimeout(function(){

typing.remove();

const response =
generateResponse(text);

addMessage(
response,
"ai",
true
);

},500);

}


/* =========================
   اضافه کردن پیام
========================= */

function addMessage(
text,
type,
save=true
){

const message =
document.createElement("div");

message.className =
"message " + type;

message.innerText =
text;

chat.appendChild(message);


if(save){

savedMessages.push({
text:text,
type:type
});

localStorage.setItem(
"ghost_chat",
JSON.stringify(savedMessages)
);

}

scrollChat();

}


/* =========================
   مغز آفلاین GHOST AI
========================= */

function generateResponse(text){

const original =
text.trim();

const msg =
original.toLowerCase();


/* سلام */

if(
msg.includes("سلام") ||
msg.includes("درود") ||
msg.includes("hello") ||
msg.includes("hi")
){

return username
? "سلام " + username + " 👋\nچطور می‌تونم کمکت کنم؟"
: "سلام 👋\nچطور می‌تونم کمکت کنم؟";

}


/* خداحافظ */

if(
msg.includes("خداحافظ") ||
msg.includes("بای") ||
msg.includes("bye")
){

return "خداحافظ 👋\nهر وقت خواستی دوباره برگرد.";

}


/* اسم */

if(
msg.includes("اسمت چیه") ||
msg.includes("اسمت") ||
msg.includes("تو کی هستی")
){

return "من GHOST AI هستم 👻🤖\nنسخه آفلاین و قانون‌محور این برنامه.";

}


/* سازنده */

if(
msg.includes("سازنده") ||
msg.includes("کی ساختت")
){

return "من توسط پروژه GHOST ACADEMY ساخته شده‌ام 👻";

}


/* ساعت */

if(
msg.includes("ساعت") ||
msg.includes("چه ساعتی")
){

return "⏰ ساعت دستگاه شما:\n" +
new Date().toLocaleTimeString("fa-IR");

}


/* تاریخ */

if(
msg.includes("تاریخ") ||
msg.includes("امروز چندمه")
){

return "📅 تاریخ دستگاه شما:\n" +
new Date().toLocaleDateString("fa-IR");

}


/* روبلاکس */

if(
msg.includes("روبلاکس") ||
msg.includes("roblox")
){

return "🎮 درباره روبلاکس:\n\n" +
"می‌تونم درباره ساخت بازی، ایده‌های بازی، تنظیمات و مفاهیم برنامه‌نویسی Roblox بهت کمک کنم.";

}


/* بازی */

if(
msg.includes("بازی") ||
msg.includes("گیم")
){

return "🎮 برای ساخت بازی می‌تونیم روی ایده، مراحل، منو، سیستم امتیاز و طراحی بازی کار کنیم.";

}


/* برنامه نویسی */

if(
msg.includes("برنامه نویسی") ||
msg.includes("برنامه‌نویسی") ||
msg.includes("کدنویسی") ||
msg.includes("کد")
){

return "💻 برنامه‌نویسی یعنی نوشتن دستورهایی که کامپیوتر یا برنامه آن‌ها را اجرا می‌کند.\n\n" +
"اگر تازه شروع کردی، HTML، CSS و JavaScript گزینه‌های خوبی برای ساخت سایت هستند.";

}


/* HTML */

if(
msg.includes("html")
){

return "🌐 HTML برای ساخت ساختار صفحات وب استفاده می‌شود.";

}


/* CSS */

if(
msg.includes("css")
){

return "🎨 CSS برای طراحی ظاهر سایت، رنگ‌ها، اندازه‌ها و چیدمان استفاده می‌شود.";

}


/* JavaScript */

if(
msg.includes("javascript") ||
msg.includes("جاوا اسکریپت")
){

return "⚡ JavaScript باعث می‌شود صفحات وب تعاملی و پویا شوند.";

}


/* هوش مصنوعی */

if(
msg.includes("هوش مصنوعی") ||
msg.includes("ai")
){

return "🤖 هوش مصنوعی فناوری‌ای است که می‌تواند برای کارهایی مثل تحلیل اطلاعات، پاسخ‌گویی، تشخیص الگو و تولید محتوا استفاده شود.";

}


/* کمک */

if(
msg.includes("کمک") ||
msg.includes("کمکم کن")
){

return "حتماً 👻\nسؤالت رو واضح بنویس تا ببینیم GHOST AI چه کمکی می‌تونه بکنه.";

}


/* حالت خوشحال */

if(
msg.includes("خوبی") ||
msg.includes("چطوری")
){

return "مرسی 😎🤖 من آماده‌ام کمک کنم!";

}


/* تشکر */

if(
msg.includes("ممنون") ||
msg.includes("مرسی") ||
msg.includes("تشکر")
){

return "خواهش می‌کنم 👻❤️";

}


/* محاسبه جمع */

const sumMatch =
original.match(
/^\s*(-?\d+(?:\.\d+)?)\s*\+\s*(-?\d+(?:\.\d+)?)\s*$/
);

if(sumMatch){

const a =
Number(sumMatch[1]);

const b =
Number(sumMatch[2]);

return "🧮 جواب:\n" +
(a+b);

}


/* محاسبه ضرب */

const multiplyMatch =
original.match(
/^\s*(-?\d+(?:\.\d+)?)\s*[×*]\s*(-?\d+(?:\.\d+)?)\s*$/
);

if(multiplyMatch){

const a =
Number(multiplyMatch[1]);

const b =
Number(multiplyMatch[2]);

return "🧮 جواب:\n" +
(a*b);

}


/* پاسخ پیش فرض */

return "🤖 پیام تو رو دریافت کردم.\n\n" +
"من در حال حاضر نسخه آفلاین GHOST AI هستم و فقط برای موضوعات مشخص پاسخ آماده دارم.\n\n" +
"می‌تونی درباره این موضوعات امتحان کنی:\n" +
"🎮 بازی\n" +
"💻 برنامه‌نویسی\n" +
"🤖 هوش مصنوعی\n" +
"🌐 HTML\n" +
"🎨 CSS\n" +
"⚡ JavaScript\n" +
"⏰ ساعت\n" +
"📅 تاریخ";

}


/* =========================
   اسکرول
========================= */

function scrollChat(){

chat.scrollTop =
chat.scrollHeight;

}


/* =========================
   پاک کردن گفتگو
========================= */

function clearChat(){

const confirmDelete =
confirm(
"آیا مطمئنی می‌خواهی تمام گفتگو پاک شود؟"
);

if(!confirmDelete){

return;

}


localStorage.removeItem(
"ghost_chat"
);

savedMessages=[];

chat.innerHTML="";

chat.appendChild(
welcome
);

welcome.style.display="block";

if(username){

welcomeTitle.innerText =
"سلام " + username + " 👻";

}else{

welcomeTitle.innerText =
"سلام 👻";

}

showStatus(
"✅ گفتگو پاک شد"
);

}


/* =========================
   رفتن به منو
========================= */

function goMenu(){

window.location.href =
"menu.html";

}


/* =========================
   پیام وضعیت
========================= */

function showStatus(text){

statusBox.innerText =
text;

statusBox.style.display =
"block";

setTimeout(function(){

statusBox.style.display =
"none";

},2000);

}


/* فوکوس روی کادر */

input.focus();

</script>

</body>

</html>
